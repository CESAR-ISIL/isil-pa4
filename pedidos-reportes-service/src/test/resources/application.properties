# PA4 - Configuración de PRUEBAS (sobrescribe src/main/resources/application.properties
# en el classpath de test). Permite ejecutar "mvn test" sin MySQL.
spring.application.name=pedidos-reportes-service
spring.datasource.url=jdbc:h2:mem:reportesdb_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
logging.level.org.springframework.jdbc.core=INFO
